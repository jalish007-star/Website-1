<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Health Care</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="tracking_area">
        <div class="inner_tracking title">
            <h2 class="health">Your Health Data</h2>
        </div>
        <div class="inner_tracking main">
            <div class="child_tracking">
                <i class=" font-size:35px";>💓</i>
                <h5>Heart Rate</h5>
                <p><span class="counter" data-target="75">0</span> bpm</p>
            </div>
            <div class="child_tracking">
                 <i class="font-size:35px";>🌙</i>
                <h5>Sleep</h5>
                <p><span class="counter" data-target="8">0</span> hours</p>
            </div>
            <div class="child_tracking">
                 <i class="font-size:35px";>💧</i>
                <h5>Water</h5>
                <p><span class="counter" data-target="10">0</span> glass</p>
            </div>
            <div class="child_tracking">
                <i class="font-size:35px";>🦶</i>
                <h5>Steps</h5>
                <p><span class="counter" data-target="11000">0</span> steps</p>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
